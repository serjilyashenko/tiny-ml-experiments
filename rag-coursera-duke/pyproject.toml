[project]
name = "rag-coursera-duke"
version = "0.1.0"
description = "RAG system built while following the Coursera course Introduction to RAG"
readme = "README.md"
authors = [
    { name = "Siarhei Ilyashenka", email = "age_bookend_0j@icloud.com" }
]
requires-python = ">=3.10,<3.11"
dependencies = [
    "pandas==1.3.5",
    "ipykernel",
    "ipywidgets",
    "qdrant-client==1.9.0",
    "sentence-transformers==2.2.2",
    "huggingface-hub<0.26",
    "openai==1.11.1",
    "numpy<2",
    "ruff>=0.17.1",
]

[project.scripts]
prepare-models = "rag_coursera_duke.prepare_models:main"
app = "rag_coursera_duke:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
